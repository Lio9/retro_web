# 本地开发 / 小规模部署编排
# 用法：在 api/ 目录执行 docker compose up --build
services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ndsweb
      SPRING_DATASOURCE_USERNAME: ndsweb
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-ndsweb}
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-32-bytes-minimum-secret!!}
      APP_SAVE_DIR: /data/saves
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173}
      RA_API_BASE: ${RA_API_BASE:-https://retroachievements.org/API}
      RA_API_KEY: ${RA_API_KEY:-}
    volumes:
      - save_data:/data/saves
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ndsweb
      POSTGRES_USER: ndsweb
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ndsweb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  save_data:
